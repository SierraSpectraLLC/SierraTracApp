{% extends "base.html" %}
{% block title %}SierraTrac — Instrument History, Verified{% endblock %}

{% block body %}
<div class="page search-page">
    <div class="search-content">
        <div class="logo-group">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                <rect x="2" y="2" width="32" height="32" rx="8" stroke="#2471A3" stroke-width="2" fill="none"/>
                <path d="M11 18H25" stroke="#2471A3" stroke-width="1.5"/>
                <path d="M18 11V25" stroke="#2471A3" stroke-width="1.5"/>
                <circle cx="18" cy="18" r="5" stroke="#2471A3" stroke-width="1.5" fill="none"/>
            </svg>
            <div>
                <h1 class="logo-title">SierraTrac</h1>
                <p class="logo-sub">Instrument Lifecycle Platform</p>
            </div>
        </div>

        <form action="{{ url_for('main.search') }}" method="GET" class="search-form">
            <div class="search-box" id="searchBox">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="7" stroke="#7D8A96" stroke-width="2"/>
                    <path d="M16 16L21 21" stroke="#7D8A96" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" name="q" placeholder="Serial number or model number"
                       class="search-input" autocomplete="off" autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Look Up Instrument</button>
        </form>

        <div class="try-row">
            <span class="try-label">Try:</span>
            <a href="{{ url_for('main.search', q='JP45821039') }}" class="try-chip">JP45821039</a>
            <a href="{{ url_for('main.search', q='DE83710294') }}" class="try-chip">DE83710294</a>
        </div>
    </div>

    <div class="search-footer">
        <span class="footer-stat"><span class="footer-num">{{ total_instruments }}</span> instruments</span>
    </div>
</div>

<script>
    const box = document.getElementById('searchBox');
    const input = box.querySelector('input');
    input.addEventListener('focus', () => box.classList.add('focused'));
    input.addEventListener('blur', () => box.classList.remove('focused'));
</script>
{% endblock %}
