<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SierraTrac Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #F4F6F8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #E8ECF0;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
        }
        .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center; }
        .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #1C2833; }
        .logo span { font-size: 10px; background: #2471A3; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .field { margin-bottom: 16px; }
        .field-label { display: block; font-size: 12px; font-weight: 600; color: #566573; margin-bottom: 6px; }
        .field-input {
            width: 100%; padding: 12px 14px; background: #F4F6F8;
            border: 2px solid #E8ECF0; border-radius: 10px;
            font-size: 15px; color: #1C2833; outline: none;
            font-family: 'IBM Plex Sans', sans-serif;
        }
        .field-input:focus { border-color: #2471A3; background: #fff; box-shadow: 0 0 0 4px rgba(36,113,163,0.08); }
        .btn {
            width: 100%; padding: 14px; background: #2471A3; color: #fff;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        .btn:active { opacity: 0.9; }
        .flash { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; background: #FDECEA; color: #C0392B; border: 1px solid rgba(192,57,43,0.15); }
        input::placeholder { color: #9CA8B4; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>SierraTrac</h1>
            <span>ADMIN</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <label class="field-label">Email</label>
                <input type="email" name="email" class="field-input" placeholder="joe@sierraspectra.com" required autofocus>
            </div>
            <div class="field">
                <label class="field-label">Password</label>
                <input type="password" name="password" class="field-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>
</body>
</html>
